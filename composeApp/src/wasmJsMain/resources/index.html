<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverythingInOne</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
    <script>
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }
    </script>
    <script>
        function showError(msg) {
            var el = document.getElementById("startup-error");
            if (!el) {
                el = document.createElement("pre");
                el.id = "startup-error";
                el.style.cssText = "position:fixed;top:0;left:0;right:0;margin:0;padding:12px;background:#fff;color:#b00020;font:12px monospace;white-space:pre-wrap;word-break:break-all;z-index:99999";
                document.documentElement.appendChild(el);
            }
            el.textContent += msg + "\n";
        }
        window.__raf = 0;
        window.__con = [];
        (function tick() { window.__raf++; requestAnimationFrame(tick); })();
        ["error", "warn"].forEach(function (k) {
            var orig = console[k];
            console[k] = function () {
                window.__con.push(k + ": " + Array.prototype.join.call(arguments, " ").slice(0, 200));
                orig.apply(console, arguments);
            };
        });
        window.addEventListener("error", function (e) {
            showError("Error: " + e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
            var r = e.reason;
            showError("Promise: " + (r && (r.stack || r.message) || r));
        });
        window.addEventListener("load", function () {
            showError("JS OK, page loaded");
            setTimeout(function () {
                var c = (function find(root) {
                    var f = root.querySelector("canvas");
                    if (f) return f;
                    var all = root.querySelectorAll("*");
                    for (var i = 0; i < all.length; i++) {
                        if (all[i].shadowRoot && (f = find(all[i].shadowRoot))) return f;
                    }
                    return null;
                })(document);
                var gl = document.createElement("canvas").getContext("webgl2");
                var r = c && c.getBoundingClientRect();
                var cs = c && getComputedStyle(c);
                showError("After 8s: canvas=" + !!c +
                    (c ? " size=" + c.width + "x" + c.height +
                        " rect=" + Math.round(r.left) + "," + Math.round(r.top) + "," + Math.round(r.width) + "x" + Math.round(r.height) +
                        " vis=" + cs.visibility + " op=" + cs.opacity + " disp=" + cs.display : "") +
                    ", webgl2=" + !!gl +
                    (gl ? " maxTex=" + gl.getParameter(gl.MAX_TEXTURE_SIZE) + " maxRB=" + gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) : "") +
                    ", wasm=" + (typeof WebAssembly === "object") +
                    ", ctxLost=" + window.__ctxLost + ", UA: " + navigator.userAgent);
                showError("rAF ticks=" + window.__raf + " visibility=" + document.visibilityState);
                if (window.__con.length) showError("console:\n" + window.__con.slice(0, 10).join("\n"));
                if (gl) {
                    var t = document.createElement("canvas");
                    t.width = t.height = 4;
                    var g2 = t.getContext("webgl2");
                    g2.clearColor(1, 0, 0, 1);
                    g2.clear(g2.COLOR_BUFFER_BIT);
                    var px = new Uint8Array(4);
                    g2.readPixels(0, 0, 1, 1, g2.RGBA, g2.UNSIGNED_BYTE, px);
                    showError("GL clear test pixel=" + px.join(",") + " (expected 255,0,0,255) glerr=" + g2.getError());
                }
            }, 8000);
        });
        window.addEventListener("webglcontextlost", function () { window.__ctxLost = true; showError("WebGL context lost"); }, true);
    </script>
    <script src="composeApp.js"></script>
</head>
<body>
</body>
</html>
