#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

# Kotlin/Native : compilation incrementale + caches
# -> accelere ENORMEMENT les rebuilds iOS sur device apres une modif
kotlin.incremental.native=true
kotlin.native.cacheKind.iosArm64=static
kotlin.native.cacheKind.iosSimulatorArm64=static

#Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

xcodeproj=~/ios